# Gooj Configuration File

# Database configuration
database:
  type: "sqlite"   # sqlite | mysql
  
  # SQLite configuration
  sqlite:
    path: "data/app.db"
    
  # MySQL configuration
  mysql:
    host: "localhost"
    port: 3306
    user: "root"
    password: ""
    dbname: "gooj"

# Server configuration
server:
  port: 8081

# Command service configuration
cmd:
  port: 9090
  host: "127.0.0.1"

# Services configuration - control which services to start
services:
  sql: true      # Enable/disable database service
  judge: true    # Enable/disable judge service
  file: true     # Enable/disable file service