<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>题目 - Gooj</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/common.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous">
  </head>
  <body>
    <div class="page-container">
      <nav class="navbar">
        <a href="/problemlist" class="navbar-brand">
          <span class="logo">G</span>
          <span>Gooj</span>
        </a>
        <div class="navbar-links">
          <a href="/problemlist"><span class="icon"></span> 题目列表</a>
          <a href="/user_profile"><span class="icon"></span> 用户信息</a>
          <a href="/contest"><span class="icon"></span> 比赛</a>
          <a href="/submissions"><span class="icon"></span> 提交记录</a>
          <a href="/ranking"><span class="icon"></span> 排行榜</a>
        </div>
        <div class="navbar-user">
          <span class="username" id="navbarUser">加载中...</span>
          <span class="rating-badge" id="navbarRating"> 1500</span>
          <button onclick="logout()">登出</button>
        </div>
      </nav>

      <div class="statement-container">
        <div class="statement-header">
          <h1 id="title" style="margin: 0;">题目</h1>
          <div class="statement-meta">
            <span id="limits" class="meta-badge"></span>
          </div>
        </div>
        
        <div class="statement-actions">
          <a id="toSubmit" href="#" class="button primary"> 提交代码</a>
          <a id="toSubmissions" href="#" class="button secondary"> 本题提交记录</a>
          <span id="editOption" style="display:none">
            <a id="editProblem" href="#" class="button secondary"> 编辑题目</a>
          </span>
        </div>

        <div class="statement-content card">
          <h2>📖 题面</h2>
          <div id="statement"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" crossorigin="anonymous"></script>

    <script>
      function qsGet(name) { const u=new URL(location.href); return u.searchParams.get(name); }
      const id = qsGet('id') || '1';
      document.getElementById('title').textContent = '题目 ' + id;

      // 增加"本题提交记录"按钮跳转
      document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('toSubmissions').href = '/submissions?problem=' + encodeURIComponent(id);
      });

      async function load(){
        const r = await fetch('/api/problem/' + encodeURIComponent(id));
        if (!r.ok) { document.getElementById('statement').textContent = '加载失败'; return; }
        const j = await r.json();
        
        if (j.statement_html) {
          document.getElementById('statement').innerHTML = j.statement_html;
        } else {
          document.getElementById('statement').textContent = j.statement || '';
        }
        
        if (j.config) {
          const cfg = j.config;
          let txt = '';
          if (cfg.time_limit) txt += ' 时间限制: ' + cfg.time_limit + 's; ';
          if (cfg.memory_limit) txt += ' 内存限制: ' + cfg.memory_limit + 'MB; ';
          document.getElementById('limits').textContent = txt;
        }
        document.getElementById('toSubmit').href = '/submit?id=' + encodeURIComponent(id);

        // Render LaTeX using KaTeX
        if (typeof renderMathInElement !== 'undefined') {
          renderMathInElement(document.getElementById('statement'), {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        }

        // 添加复制按钮到代码块
        setTimeout(initCodeCopyButtons, 100);

        // Check user permissions for editing
        const user = localStorage.getItem('username');
        if (user) {
          const permRes = await fetch('/api/user_permissions?username=' + encodeURIComponent(user) + "&permission=EditPermission");
          if (permRes.ok) {
            const perms = await permRes.json();
            if (perms.permited) {
              document.getElementById('editOption').style.display = 'inline';
              document.getElementById('editProblem').href = '/edit?problem=' + encodeURIComponent(id);
            }
          }
        }
      }
      load();
    </script>
  </body>
</html>
