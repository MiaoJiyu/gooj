<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>提交代码 - Gooj</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/common.js"></script>
  </head>
  <body>
    <div class="page-container">
      <nav class="navbar">
        <a href="/problemlist" class="navbar-brand">
          <span class="logo">G</span>
          <span>Gooj</span>
        </a>
        <div class="navbar-links">
          <a href="/problemlist"><span class="icon"></span> 题目列表</a>
          <a href="/user_profile"><span class="icon"></span> 用户信息</a>
          <a href="/contest"><span class="icon"></span> 比赛</a>
          <a href="/submissions"><span class="icon"></span> 提交记录</a>
          <a href="/ranking"><span class="icon"></span> 排行榜</a>
        </div>
        <div class="navbar-user">
          <span class="username" id="navbarUser">加载中...</span>
          <span class="rating-badge" id="navbarRating"> 1500</span>
          <button onclick="logout()">登出</button>
        </div>
      </nav>

      <div class="card">
        <h1> 提交代码</h1>
        <div class="user-info">
          <div>当前用户：<strong id="username"></strong></div>
          <div>题目：<strong id="problemId"></strong></div>
        </div>
        <div id="limits"></div>
        <div id="result" style="margin-top: 10px; white-space: pre-wrap; font-family: monospace;"></div>
      </div>

      <div class="card">
        <h2>C++ 代码</h2>
        <textarea id="code" class="code-editor">#include <bits/stdc++.h>
using namespace std;
int main(){
    cout<<"hello"<<endl;
    return 0;
}
</textarea>
      </div>
      <div class="actions">
        <button id="submitBtn" class="success"> 提交并运行</button>
        <a href="/submissions" class="button secondary"> 查看所有提交</a>
        <span id="status"></span>
      </div>
    </div>

    <script>
      function qsGet(name) {
        const u = new URL(location.href);
        return u.searchParams.get(name);
      }
      const username = localStorage.getItem('username') || '';
      const problemId = qsGet('id') || '';
      
      const usernameElement = document.getElementById('username');
      if (usernameElement) usernameElement.textContent = username;
      
      const problemIdElement = document.getElementById('problemId');
      if (problemIdElement) problemIdElement.textContent = problemId;

      async function loadProblem() {
        if (!problemId) return;
        try {
          const r = await fetch('/api/problem/' + encodeURIComponent(problemId));
          if (!r.ok) return;
          const j = await r.json();
          if (j.config) {
            const cfg = j.config;
            let txt = '';
            if (cfg.time_limit) txt += ' 时间限制: ' + cfg.time_limit + 's; ';
            if (cfg.memory_limit) txt += ' 内存限制: ' + cfg.memory_limit + 'MB; ';
            document.getElementById('limits').textContent = txt;
          }
        } catch (e) { console.error(e); }
      }

      document.getElementById('submitBtn').addEventListener('click', async () => {
        if (!username) return alert('未登录，请先登录');
        if (!problemId) return alert('缺少题目编号');
        const code = document.getElementById('code').value;
        const submitBtn = document.getElementById('submitBtn');
        const statusEl = document.getElementById('status');
        
        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';
        statusEl.textContent = '';
        
        try {
          const res = await fetch('/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, problem: problemId, code })
          });
          const data = await res.json();
          
          if (data.error) {
            statusEl.textContent = ' ' + data.error;
            statusEl.style.color = 'var(--danger-color)';
          } else {
            statusEl.textContent = ' 提交成功! 提交ID: ' + data.id;
            statusEl.style.color = 'var(--success-color)';
            setTimeout(() => location.href = '/submissions', 1500);
          }
        } catch (e) {
          statusEl.textContent = ' 提交失败: ' + e.message;
          statusEl.style.color = 'var(--danger-color)';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = ' 提交并运行';
        }
      });

      loadProblem();
    </script>
  </body>
</html>
