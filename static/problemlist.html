<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>题目列表 - Gooj</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/common.js"></script>
  </head>
  <body>
    <div class="page-container">
      <nav class="navbar">
        <a href="/problemlist" class="navbar-brand">
          <span class="logo">G</span>
          <span>Gooj</span>
        </a>
        <div class="navbar-links">
          <a href="/problemlist" class="active"> 题目列表</a>
          <a href="/user_profile"> 用户信息</a>
          <a href="/contest"> 比赛</a>
          <a href="/submissions"> 提交记录</a>
          <a href="/ranking"> 排行榜</a>
        </div>
        <div class="navbar-user">
          <span class="username" id="navbarUser">加载中...</span>
          <span class="rating-badge" id="navbarRating"> 1500</span>
          <button onclick="logout()">登出</button>
        </div>
      </nav>

      <div id="manageUsersOption" style="display:none;margin-bottom:16px">
        <a href="/manage" class="button primary">管理用户</a>
      </div>

      <div class="card">
        <h1> 题目列表</h1>
        <table>
          <thead><tr><th>ID</th><th>标题</th><th>操作</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="pager">
          <button id="prev" class="secondary"> 上一页</button>
          <span id="pageInfo"></span>
          <button id="next" class="secondary">下一页 </button>
        </div>
      </div>
    </div>

    <script>
      const per = 20;
      let page = 1;

      async function load() {
        try {
          const res = await fetch(`/problems?page=${page}&per=${per}`);
          if (!res.ok) throw new Error('Failed to load problems');
          const j = await res.json();
          const tbody = document.getElementById('tbody');
          tbody.innerHTML = '';
          
          const username = localStorage.getItem('username');
          
          if (!j.problems || j.problems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">暂无题目</td></tr>';
          } else {
            j.problems.forEach(p => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${p.ID}</td>
                <td>${p.Title || ''}</td>
                <td><a href="/problem?id=${encodeURIComponent(p.ID)}">查看题目</a></td>
              `;
              tbody.appendChild(tr);
            });
          }
          
          const total = j.total || 0;
          const pages = Math.ceil(total / per);
          document.getElementById('pageInfo').textContent = `第 ${page} / ${pages} 页，总 ${total} 道题`;

          // Check user permissions for managing users
          if (username) {
            const permRes = await fetch('/api/user_permissions?username=' + encodeURIComponent(username) + "&permission=UserPermission");
            if (permRes.ok) {
              const perms = await permRes.json();
              if (perms.permited) {
                document.getElementById('manageUsersOption').style.display = 'block';
              }
            }
          }
        } catch (error) {
          console.error('Error loading problems:', error);
          document.getElementById('tbody').innerHTML = '<tr><td colspan="3" style="text-align:center;color:red;">加载失败</td></tr>';
        }
      }

      document.getElementById('prev').addEventListener('click', () => {
        if (page > 1) {
          page--;
          load();
        }
      });

      document.getElementById('next').addEventListener('click', () => {
        page++;
        load();
      });

      load();
    </script>
  </body>
</html>
