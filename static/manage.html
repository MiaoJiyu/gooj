<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>管理中心 - Gooj</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .shortcut-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      .shortcut-card {
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        border: 1px solid #dbeafe;
        border-radius: 14px;
        padding: 18px;
      }
      .shortcut-card h3 {
        margin-bottom: 10px;
      }
      .shortcut-card p {
        color: #4b5563;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="manage-container">
      <nav>
        <a href="/problemlist">题目列表</a>
        <a href="/contest">比赛</a>
        <a href="/ranking">排行榜</a>
        <a href="/">返回首页</a>
      </nav>

      <div class="card">
        <h1>管理中心</h1>
        <div class="shortcut-grid">
          <div class="shortcut-card">
            <h3>比赛管理</h3>
            <p>独立创建、删除、查看比赛，进入比赛详情页与排行榜页。</p>
            <a href="/contest_manage" class="button primary">打开比赛管理</a>
          </div>
          <div class="shortcut-card">
            <h3>用户管理</h3>
            <p>审核审批、批量导入、重置密码与删除用户。</p>
            <a href="/manage_users" class="button secondary">打开用户管理</a>
          </div>
          <div class="shortcut-card">
            <h3>题目编辑</h3>
            <p>直接通过题目 ID 加载题面、测试数据与 metadata。</p>
            <a href="/edit" class="button secondary">打开题目编辑</a>
          </div>
          <div class="shortcut-card">
            <h3>题目上传</h3>
            <p>上传新的题目包并导入测试数据。</p>
            <a href="/upload_problem" class="button secondary">上传题目</a>
          </div>
          <div class="shortcut-card">
            <h3>用户组</h3>
            <p>创建用户组并设置权限。</p>
            <a href="/create_group" class="button secondary">创建用户组</a>
          </div>
          <div class="shortcut-card">
            <h3>新增用户</h3>
            <p>直接创建新账号并分配用户组。</p>
            <a href="/create_user" class="button success">创建用户</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
